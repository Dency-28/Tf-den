name: Terraform CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/plan') || contains(github.event.comment.body, '/apply')))

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 🧩 Disable backend only for plan
      - name: Terraform Init (Local for Plan)
        if: |
          github.event_name != 'issue_comment' ||
          contains(github.event.comment.body, '/plan')
        run: |
          echo "🚫 Using local backend for PLAN..."
          sed -i '/backend "s3" {/,/}/ s/^/#/' terraform_infra/backend.tf || true
          rm -rf terraform_infra/.terraform terraform_infra/.terraform.lock.hcl || true
          terraform -chdir=terraform_infra init -backend=false -input=false

      - name: Terraform Init (Real for Apply)
        if: |
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '/apply')
        run: |
          echo "🌍 Using real S3 backend for APPLY..."
          sed -i '/^#/d' terraform_infra/backend.tf || true
          terraform -chdir=terraform_infra init -input=false

      - name: Terraform Validate
        run: |
          terraform -chdir=terraform_infra fmt -check=false
          terraform -chdir=terraform_infra validate

      - name: Terraform Plan
        if: |
          github.event_name != 'issue_comment' ||
          contains(github.event.comment.body, '/plan')
        id: plan
        run: |
          echo "🧩 Running Terraform plan..."
          terraform -chdir=terraform_infra plan -no-color | tee plan.txt
          {
            echo '### 🧩 Terraform Plan Result'
            echo '<details><summary>Click to view plan logs</summary>'
            echo ''
            echo '```hcl'
            cat plan.txt
            echo '```'
            echo '</details>'
          } > plan_comment.md

      - name: Post Plan Output to PR
        if: steps.plan.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          header: 🧩 Terraform Plan Output
          path: plan_comment.md
          recreate: true

      - name: Terraform Apply
        if: |
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '/apply')
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform -chdir=terraform_infra apply -auto-approve | tee apply.txt
          {
            echo '### 🚀 Terraform Apply Result'
            echo '<details><summary>Click to view apply logs</summary>'
            echo ''
            echo '```bash'
            cat apply.txt
            echo '```'
            echo '</details>'
          } > apply_comment.md

      - name: Post Apply Output to PR
        if: |
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '/apply')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          header: 🚀 Terraform Apply Output
          path: apply_comment.md
          recreate: true
