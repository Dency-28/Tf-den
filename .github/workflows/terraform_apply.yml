name: Terraform-CI-CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/plan') ||
        contains(github.event.comment.body, '/apply')))

    steps:
      # ─────────── Checkout Repo ───────────
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # ─────────── Setup Terraform ───────────
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # ─────────── Configure AWS credentials ───────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─────────── Get PR number ───────────
      - id: pr
        uses: jwalton/gh-find-current-pr@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          state: open

      # ─────────── Backend Init (Only for Apply / Manual Dispatch) ───────────
      - name: Backend Init
        id: backend
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/apply'))
        run: |
          echo "🔹 Initializing Terraform backend..."
          terraform -chdir=terraform_backend init -input=false
          terraform -chdir=terraform_backend apply -auto-approve -no-color | tee backend_apply.txt

          echo "🔹 Capturing backend outputs..."
          TF_BUCKET=$(terraform -chdir=terraform_backend output -raw tf_state_bucket)
          TF_LOCKTABLE=$(terraform -chdir=terraform_backend output -raw tf_state_lock_table)

          echo "TF_BUCKET=$TF_BUCKET" >> $GITHUB_ENV
          echo "TF_LOCKTABLE=$TF_LOCKTABLE" >> $GITHUB_ENV

          echo "✅ Backend setup complete: $TF_BUCKET / $TF_LOCKTABLE"

      # ─────────── Terraform Plan ───────────
      - name: Terraform Plan
        id: plan
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/plan'))
        run: |
          echo "🔹 Running Terraform Plan (no backend)..."
          terraform -chdir=terraform_infra init -backend=false -reconfigure
          terraform -chdir=terraform_infra fmt
          terraform -chdir=terraform_infra validate
          terraform -chdir=terraform_infra plan -no-color | tee plan.txt

          {
            echo '### 🧩 Terraform Plan Result'
            echo '<details><summary>Click to view full plan logs</summary>'
            echo ''
            echo '```hcl'
            cat plan.txt
            echo '```'
            echo '</details>'
          } > plan_comment.md

      - name: Post Plan Output
        if: steps.plan.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.pr.outputs.number || github.event.issue.number }}
          header: "Terraform Plan Output"
          path: plan_comment.md
          recreate: true

      # ─────────── Terraform Apply ───────────
      - name: Terraform Apply
        id: apply
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/apply'))
        run: |
          echo "🔹 Configuring Terraform backend with outputs..."
          cat <<EOF > terraform_infra/backend.auto.tfbackend
          bucket         = "${TF_BUCKET}"
          key            = "terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCKTABLE}"
          EOF

          echo "🔹 Initializing Terraform with backend..."
          terraform -chdir=terraform_infra init -backend-config=backend.auto.tfbackend -reconfigure
          terraform -chdir=terraform_infra fmt
          terraform -chdir=terraform_infra validate

          echo "🔹 Generating Terraform plan..."
          terraform -chdir=terraform_infra plan -out=tfplan -no-color | tee plan.txt

          echo "🔹 Applying changes..."
          terraform -chdir=terraform_infra apply -auto-approve tfplan -no-color | tee apply.txt

          echo "🔹 Collecting outputs..."
          EC2_IP=$(terraform -chdir=terraform_infra output -raw ec2_public_ip || echo "N/A")
          RDS_ENDPOINT=$(terraform -chdir=terraform_infra output -raw rds_endpoint || echo "N/A")

          {
            echo '### 🚀 Terraform Apply Result'
            echo '<details><summary>Click to view full apply logs</summary>'
            echo ''
            echo '```hcl'
            cat apply.txt
            echo '```'
            echo '</details>'
            echo ''
            echo '**EC2 Public IP:** '"$EC2_IP"
            echo '**RDS Endpoint:** '"$RDS_ENDPOINT"
          } > apply_comment.md

      - name: Post Apply Output
        if: steps.apply.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.pr.outputs.number || github.event.issue.number }}
          header: "Terraform Apply Output"
          path: apply_comment.md
          recreate: true
