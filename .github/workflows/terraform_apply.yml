name: Terraform

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/plan') ||
        contains(github.event.comment.body, '/apply')))

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ✅ Disable backend
      - name: Terraform Init (No Backend)
        run: |
          echo "🚫 Skipping remote backend — disabling full backend block..."
          sed -i '/backend "s3" {/,/}/ s/^/#/' terraform_infra/backend.tf || true

          echo "🧩 Initializing Terraform (local backend only)..."
          rm -rf terraform_infra/.terraform terraform_infra/.terraform.lock.hcl || true
          terraform -chdir=terraform_infra init -backend=false -input=false

      - name: Terraform Format & Validate
        run: |
          terraform -chdir=terraform_infra fmt -check=false
          terraform -chdir=terraform_infra validate

      # 🧩 Terraform Plan
      - name: Terraform Plan
        id: plan
        if: contains(github.event.comment.body, '/plan') || github.event_name == 'pull_request'
        run: |
          echo "🧩 Running Terraform plan locally (no backend)..."
          terraform -chdir=terraform_infra plan -no-color | tee plan.txt
          {
            echo '### 🧩 Terraform Plan Result (Local State)'
            echo '<details><summary>Click to view full plan logs</summary>'
            echo ''
            echo '```hcl'
            cat plan.txt
            echo '```'
            echo '</details>'
          } > plan_comment.md

      - name: Post Plan Output to PR
        if: (contains(github.event.comment.body, '/plan') || github.event_name == 'pull_request') && steps.plan.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          header: 🧩 Terraform Plan Output (Local State)
          path: plan_comment.md
          recreate: true

      # 🚀 Terraform Apply (only when '/apply' comment is used)
      - name: Terraform Apply
        if: contains(github.event.comment.body, '/apply')
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform -chdir=terraform_infra apply -auto-approve -no-color | tee apply.txt

          {
            echo '### 🚀 Terraform Apply Result (Local State)'
            echo '<details><summary>Click to view full apply logs</summary>'
            echo ''
            echo '```hcl'
            cat apply.txt
            echo '```'
            echo '</details>'
          } > apply_comment.md

      - name: Post Apply Output to PR
        if: contains(github.event.comment.body, '/apply')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          header: 🚀 Terraform Apply Output (Local State)
          path: apply_comment.md
          recreate: true
