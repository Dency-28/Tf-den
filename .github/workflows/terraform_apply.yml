name: Terraform CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # 🟢 Initialize Backend (fixes “backend init required”)
      - name: Terraform Init (with reconfigure)
        id: init
        run: terraform -chdir=terraform_infra init -reconfigure

      # ✅ Validate
      - name: Terraform Validate
        id: validate
        run: terraform -chdir=terraform_infra validate

      # 🟡 Detect Trigger
      - name: Check for Comment Trigger
        id: trigger
        if: github.event_name == 'issue_comment'
        run: |
          comment_body=$(echo "${{ github.event.comment.body }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$comment_body" == "/plan" ]]; then
            echo "trigger=plan" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/apply" ]]; then
            echo "trigger=apply" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/tf" ]]; then
            echo "trigger=tf" >> $GITHUB_OUTPUT
          else
            echo "trigger=none" >> $GITHUB_OUTPUT
          fi

      # 🟢 Terraform Plan
      - name: Terraform Plan
        if: steps.trigger.outputs.trigger == 'plan' || steps.trigger.outputs.trigger == 'tf'
        id: plan
        run: terraform -chdir=terraform_infra plan -out=tfplan | tee plan.txt

      - name: Post Plan Comment
        if: steps.trigger.outputs.trigger == 'plan' || steps.trigger.outputs.trigger == 'tf'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🧭 Terraform Plan Result
            <details><summary>Click to expand</summary>

            ```terraform
            ${{ steps.plan.outputs.stdout }}
            ```

            </details>

      # 🟢 Terraform Apply
      - name: Terraform Apply
        if: steps.trigger.outputs.trigger == 'apply' || steps.trigger.outputs.trigger == 'tf'
        id: apply
        run: terraform -chdir=terraform_infra apply -auto-approve tfplan | tee apply.txt

      - name: Post Apply Comment
        if: steps.trigger.outputs.trigger == 'apply' || steps.trigger.outputs.trigger == 'tf'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🚀 Terraform Apply Result
            <details><summary>Click to expand logs</summary>

            ```terraform
            ${{ steps.apply.outputs.stdout }}
            ```

            </details>
