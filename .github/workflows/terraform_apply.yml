name: Terraform CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # 🧠 Backend Init (with AWS credentials passed explicitly)
      - name: Terraform Init (Backend)
        working-directory: terraform_infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform init -reconfigure

      # Optional validation
      - name: Terraform Validate
        working-directory: terraform_infra
        run: terraform validate

      # 🧩 Detect comment triggers
      - name: Check for Comment Trigger
        id: trigger
        if: github.event_name == 'issue_comment'
        run: |
          comment_body=$(echo "${{ github.event.comment.body }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$comment_body" == "/plan" ]]; then
            echo "trigger=plan" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/apply" ]]; then
            echo "trigger=apply" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/tf" ]]; then
            echo "trigger=tf" >> $GITHUB_OUTPUT
          else
            echo "trigger=none" >> $GITHUB_OUTPUT
          fi

      # 🧱 Terraform Plan
      - name: Terraform Plan
        if: steps.trigger.outputs.trigger == 'plan' || steps.trigger.outputs.trigger == 'tf'
        working-directory: terraform_infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform plan -out=tfplan | tee plan.txt

      - name: Post Plan Result
        if: steps.trigger.outputs.trigger == 'plan' || steps.trigger.outputs.trigger == 'tf'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🧭 Terraform Plan Result
            <details><summary>View Logs</summary>

            ```terraform
            $(cat terraform_infra/plan.txt)
            ```

            </details>

      # 🚀 Terraform Apply
      - name: Terraform Apply
        if: steps.trigger.outputs.trigger == 'apply' || steps.trigger.outputs.trigger == 'tf'
        working-directory: terraform_infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform apply -auto-approve tfplan | tee apply.txt

      - name: Post Apply Result
        if: steps.trigger.outputs.trigger == 'apply' || steps.trigger.outputs.trigger == 'tf'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🚀 Terraform Apply Result
            <details><summary>View Logs</summary>

            ```terraform
            $(cat terraform_infra/apply.txt)
            ```

            </details>
