name: Terraform CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform-init:
    name: 🏗️ Terraform Init (Backend)
    runs-on: ubuntu-latest
    outputs:
      trigger: ${{ steps.trigger.outputs.trigger }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check Trigger Type
        id: trigger
        if: github.event_name == 'issue_comment'
        run: |
          comment_body=$(echo "${{ github.event.comment.body }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$comment_body" == "/plan" ]]; then
            echo "trigger=plan" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/apply" ]]; then
            echo "trigger=apply" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/tf" ]]; then
            echo "trigger=tf" >> $GITHUB_OUTPUT
          else
            echo "trigger=none" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        working-directory: terraform_infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform init -reconfigure

  terraform-plan:
    name: 🧭 Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-init
    if: needs.terraform-init.outputs.trigger == 'plan' || needs.terraform-init.outputs.trigger == 'tf'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: terraform_infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform init -reconfigure

      - name: Terraform Plan
        working-directory: terraform_infra
        run: terraform plan -out=tfplan | tee plan.txt

      - name: Post Plan Result
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🧭 Terraform Plan Result
            <details><summary>View Logs</summary>

            ```terraform
            $(cat terraform_infra/plan.txt)
            ```

            </details>

  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-init
    if: needs.terraform-init.outputs.trigger == 'apply' || needs.terraform-init.outputs.trigger == 'tf'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: terraform_infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform_infra
        run: terraform apply -auto-approve | tee apply.txt

      - name: Post Apply Result
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🚀 Terraform Apply Result
            <details><summary>View Logs</summary>

            ```terraform
            $(cat terraform_infra/apply.txt)
            ```

            </details>
