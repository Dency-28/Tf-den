name: Terraform CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/plan') ||
        contains(github.event.comment.body, '/apply')))

    steps:
      # ─────────── Checkout Repo ───────────
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # ─────────── Setup Terraform ───────────
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # ─────────── Configure AWS credentials ───────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─────────── Get PR number ───────────
      - id: pr
        uses: jwalton/gh-find-current-pr@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          state: open

      # ─────────── Backend Setup ───────────
      - name: Init & Apply Backend
        run: |
          terraform -chdir=terraform_backend init -input=false
          terraform -chdir=terraform_backend plan -no-color | tee plan.txt

      # ─────────── Terraform Plan ───────────
      - name: Terraform Plan
        id: plan
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/plan'))
        run: |
          terraform -chdir=terraform_infra init -reconfigure
          terraform -chdir=terraform_infra fmt
          terraform -chdir=terraform_infra validate
          terraform -chdir=terraform_infra plan -no-color | tee plan.txt
          {
            echo '### 🧩 Terraform Plan Result'
            echo '<details><summary>Click to view full plan logs</summary>'
            echo ''
            echo '```hcl'
            cat plan.txt
            echo '```'
            echo '</details>'
          } > plan_comment.md

      # ─────────── Post Plan Output to PR ───────────
      - name: Post Plan Output
        if: steps.plan.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.pr.outputs.number || github.event.issue.number }}
          header: 🧩 Terraform Plan Output
          path: plan_comment.md
          recreate: true

      # ─────────── Terraform Apply ───────────
      - name: Terraform Apply (Full Pipeline)
        id: apply
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/apply'))
        run: |
          echo "🔹 Running Full Terraform Pipeline for /apply ..."
          # Backend
          terraform -chdir=terraform_backend init -input=false
          terraform -chdir=terraform_backend apply -auto-approve -no-color | tee backend_apply.txt
          
          # Infra Init + Plan + Apply
          terraform -chdir=terraform_infra init -reconfigure
          terraform -chdir=terraform_infra fmt
          terraform -chdir=terraform_infra validate
          terraform -chdir=terraform_infra plan -out=tfplan -no-color | tee plan.txt
          terraform -chdir=terraform_infra apply -auto-approve tfplan -no-color | tee apply.txt

          # Capture Outputs (EC2 IP + RDS Endpoint)
          EC2_IP=$(terraform -chdir=terraform_infra output -raw ec2_public_ip || echo "N/A")
          RDS_ENDPOINT=$(terraform -chdir=terraform_infra output -raw rds_endpoint || echo "N/A")

          # Create comment markdown
          {
            echo '### 🚀 Terraform Apply Result'
            echo '<details><summary>Click to view full apply logs</summary>'
            echo ''
            echo '```hcl'
            cat apply.txt
            echo '```'
            echo '</details>'
            echo ''
            echo '### 🌍 Deployment Outputs'
            echo "- **EC2 Public IP:** $EC2_IP"
            echo "- **RDS Endpoint:** $RDS_ENDPOINT"
          } > apply_comment.md

      # ─────────── Post Apply Output to PR ───────────
      - name: Post Apply Output
        if: steps.apply.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.pr.outputs.number || github.event.issue.number }}
          header: 🚀 Terraform Apply Output
          path: apply_comment.md
          recreate: true
