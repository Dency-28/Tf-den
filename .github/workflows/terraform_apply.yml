name: Terraform CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # ✅ Initialize backend with credentials
      - name: Terraform Init (with reconfigure)
        run: terraform -chdir=terraform_infra init -reconfigure

      - name: Terraform Validate
        run: terraform -chdir=terraform_infra validate

      # Detect comment trigger
      - name: Check for Comment Trigger
        id: trigger
        if: github.event_name == 'issue_comment'
        run: |
          comment_body=$(echo "${{ github.event.comment.body }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$comment_body" == "/plan" ]]; then
            echo "trigger=plan" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/apply" ]]; then
            echo "trigger=apply" >> $GITHUB_OUTPUT
          elif [[ "$comment_body" == "/tf" ]]; then
            echo "trigger=tf" >> $GITHUB_OUTPUT
          else
            echo "trigger=none" >> $GITHUB_OUTPUT
          fi

      # Terraform Plan
      - name: Terraform Plan
        if: steps.trigger.outputs.trigger == 'plan' || steps.trigger.outputs.trigger == 'tf'
        run: terraform -chdir=terraform_infra plan -out=tfplan | tee plan.txt

      - name: Post Plan Comment
        if: steps.trigger.outputs.trigger == 'plan' || steps.trigger.outputs.trigger == 'tf'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🧭 Terraform Plan Result
            <details><summary>Click to expand</summary>

            ```terraform
            $(cat plan.txt)
            ```

            </details>

      # Terraform Apply
      - name: Terraform Apply
        if: steps.trigger.outputs.trigger == 'apply' || steps.trigger.outputs.trigger == 'tf'
        run: terraform -chdir=terraform_infra apply -auto-approve tfplan | tee apply.txt

      - name: Post Apply Comment
        if: steps.trigger.outputs.trigger == 'apply' || steps.trigger.outputs.trigger == 'tf'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🚀 Terraform Apply Result
            <details><summary>Click to expand logs</summary>

            ```terraform
            $(cat apply.txt)
            ```

            </details>
